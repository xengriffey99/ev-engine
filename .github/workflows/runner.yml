name: nba-ev-runner

# Coverage chain: a dispatched run loops minute by minute for `minutes` (default 330 when
# chained), then dispatches the next run, so coverage does not depend on cron. Outside
# 08:45-02:00 ET a dispatched run waits for the window; a cron run exits at once.
# The cron schedule stays as a backup (GitHub delays schedules on new repos by hours).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes this run should cover"
        default: "55"

concurrency:
  group: nba-ev-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # the chain step dispatches the next run

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATA_PASSPHRASE: ${{ secrets.DATA_PASSPHRASE }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      NBA_EV_BET_STATE: ${{ vars.NBA_EV_BET_STATE || 'ME' }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secrets
        run: |
          [ -n "$ODDS_API_KEY" ] || { echo "::error::Add the ODDS_API_KEY repository secret"; exit 1; }
          [ -n "$DATA_PASSPHRASE" ] || { echo "::error::Add the DATA_PASSPHRASE repository secret"; exit 1; }
      - name: Restore state
        run: scripts/ci_state.sh restore
      - name: Snapshot loop
        run: scripts/ci_loop.sh "${{ github.event.inputs.minutes || '55' }}" "${{ github.event_name }}"
      - name: Save state
        if: always()
        run: scripts/ci_state.sh save
      - name: Chain next run
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run runner.yml --repo "$GITHUB_REPOSITORY" --ref main -f minutes=330
      - name: Missed-close alert
        if: always()
        run: |
          if [ -s /tmp/close_alert ]; then
            echo "::error::A scheduled close snapshot was missed or errored (CLV for those rows is lost):"
            cat /tmp/close_alert
            exit 1   # red run -> GitHub emails the repo owner
          fi
